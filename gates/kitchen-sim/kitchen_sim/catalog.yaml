    aisle: produce
    sold_by: weight
    pack_g: 907
    pack_count: null
    price: 7.99
    perishable: true
    needs_refrigeration: true
    keeps_days_raw: 4
    freezable: true
    notes: "The cut-fruit case. Costs far more per gram than a whole pineapple but every gram is edible."

