    perishable: true
    needs_refrigeration: true
    keeps_days_raw: 270
    freezable: true
    notes: "Already cooked - pink, curled, for shrimp cocktail. Sits in the same freezer door as the raw bags and is a very easy mistake. Cooking it again makes it rubbery."

  - id: chicken_breast_frozen_3lb
    display_name: "Boneless Skinless Chicken Breast, frozen 3 lb bag"
    aliases: [frozen chicken, chicken breast, frozen chicken breast]
    aisle: frozen
    sold_by: weight
    pack_g: 1361
    pack_count: null
    price: 13.99
    perishable: true
