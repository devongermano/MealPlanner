    aisle: produce
    sold_by: weight
    pack_g: 19
    pack_count: null
    price: 2.99
    perishable: true
    needs_refrigeration: true
    keeps_days_raw: 14
    freezable: true
    notes: "The smallest fresh rosemary a supermarket sells - a 0.66 oz plastic clamshell of a few sprigs. You cannot buy less, so any recipe needing under ~19 g wastes the remainder unless it is dried or frozen."

