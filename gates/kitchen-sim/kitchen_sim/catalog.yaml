    pack_g: 200
    pack_count: 1
    price: 1.49
    perishable: true
    needs_refrigeration: true
    keeps_days_raw: 4
    freezable: false
    notes: "Sold per avocado. 200 g is the whole fruit; pit and skin are ~30%, so edible flesh is only ~140 g. Sold rock-hard or ripe with no price difference - a plan that needs it on day 1 and a plan that needs it on day 5 are different shopping problems."

