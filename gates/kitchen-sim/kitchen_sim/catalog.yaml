    perishable: true
    needs_refrigeration: true
    keeps_days_raw: 1
    freezable: false
    notes: "Per pound from the counter case, 26/30 count. The sign says 'fresh' but it is previously frozen and thawed by the store, which is why it must be cooked within a day and must NOT be refrozen. Anyone buying multiple pounds for use across a week is buying the wrong product - the frozen bags are the same shrimp, cheaper, and keep for months."

