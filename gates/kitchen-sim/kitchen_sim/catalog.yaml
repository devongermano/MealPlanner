    aisle: produce
    sold_by: weight
    pack_g: 454
    pack_count: null
    price: 1.49
    perishable: true
    needs_refrigeration: false
    keeps_days_raw: 30
    freezable: false
    notes: "Priced per pound in the bin; buy any weight. A medium onion is ~200 g, so a pound is 2-3 onions. Keep in a dark pantry, NOT the fridge - refrigeration makes them soft and sprouty."

  - id: onion_yellow_bag_3lb
