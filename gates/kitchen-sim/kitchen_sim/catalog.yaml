    aisle: produce
    sold_by: weight
    pack_g: 1361
    pack_count: null
    price: 3.99
    perishable: true
    needs_refrigeration: false
    keeps_days_raw: 30
    freezable: false
    notes: "Fixed 3 lb bag, roughly 6-8 onions of mixed size. Cheaper per pound than loose but you cannot open it."

  - id: onion_white_loose
