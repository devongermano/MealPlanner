    aliases: [pineapple, fresh pineapple, whole pineapple]
    aisle: produce
    sold_by: count
    pack_g: 1800
    pack_count: 1
    price: 4.49
    perishable: true
    needs_refrigeration: false
    keeps_days_raw: 4
    freezable: true
    notes: "Sold per pineapple at a flat price regardless of size. A whole one runs 1.6-2.0 kg with crown, and rind plus core is roughly half the weight, so ~900 g of usable fruit comes out of an 1800 g pineapple. Once cut it must be refrigerated and eaten within 4 days."

  - id: pineapple_chunks_tub
