# =============================================================================
# AUTHORING NOTES - mismatches I noticed
# =============================================================================
#
# These are things in the planner's shopping list that do not line up with how a
# real supermarket sells food. I did NOT bend the catalog to accommodate any of
# them. Recorded here as predictions; the gate should rediscover them on its own.
#
# --- Products that are not products -----------------------------------------
#
# 1. "spices - 3 x 100g"
#    No store sells anything called "spices." It is a category, not a SKU. There
#    is no shelf to walk to, no jar to pick up, no price. Separately, 100 g is
#    larger than every jar on a supermarket spice rack: cumin comes in 1.5 oz
#    (43 g), chili powder in 2.5 oz (71 g), dried oregano in 0.5 oz (14 g).
#    "3 x 100g of spices" is unshoppable twice over - wrong name, impossible size.
#
# 2. "dried_chiles - 2 x 100g"
#    Same failure. Guajillo, ancho, arbol, pasilla and chipotle are different
#    ingredients with different heat and flavor, sold in separate 2-4 oz
#    (57-113 g) cello bags. "Dried chiles" names none of them, and 100 g is not
#    a bag size.
#
# --- Sold by count, requested by weight -------------------------------------
#
# 3. "eggs - 2 x 600g"
#    Eggs are sold by the dozen and graded by size. A carton of Large is 24 oz /
#    680 g net in the shell by USDA definition. There is no 600 g egg package.
#    The number also silently mixes shell weight in: 600 g of shelled egg is 12
#    eggs, but 600 g of carton is only ~10.5.
#
# 4. "lime - 3 x 335g"
#    Limes are rung up individually (~67 g each) or in 2 lb mesh bags. 335 g is
#    exactly five limes, which suggests the number was computed rather than
#    observed. No 335 g lime package exists.
#
# 5. "avocado - 3 x 200g"
#    Avocados are sold each. 200 g is a fair weight for a whole Hass, but pit and
#    skin are ~30%, so "600 g of avocado" buys only ~420 g of edible flesh. If
#    the recipe wanted 600 g of flesh, the list is short by two avocados.
#
# 6. "poblano - 3 x 300g"
#    Poblanos are sold per pepper (~100 g). 300 g is three peppers, so the total
#    is right by accident, but there is no 300 g unit to buy and no way to ask
#    for one.
#
# 7. "scallion - 1 x 100g"
#    Scallions come in banded bunches. ~100 g is a realistic bunch, but bunches
#    run 80-130 g and include roots and tough tops - so the shopper cannot buy
#    100 g and the 100 g they do get is not 100 g of usable scallion.
#
# 8. "cilantro - 9 x 60g"
#    Cilantro is sold by the bunch, and bunch weight is genuinely variable
#    (45-90 g), so "60 g" is a fiction of precision. Worse, roughly half a bunch
#    is stem: nine bunches at a nominal 60 g is ~540 g gross but only ~270 g of
#    leaf. And nine bunches of cilantro in one cart, all wilting inside a week,
#    should raise an eyebrow on its own.
#
# 9. "flour_tortilla - 7 x 20 oz"
#    20 oz (567 g) is a real pack - 8 burrito-size tortillas - so the weight is
#    right. But nobody shops tortillas by weight; they shop by count and by
#    diameter, and the list names neither. Seven packs is 56 tortillas, which is
#    a quantity worth confirming rather than inferring.
#
# --- Variable-weight meat requested as exact packs ---------------------------
#
# 10. "chicken_breast - 5 x 32 oz" and "chicken_thigh - 1 x 32 oz"
#     Meat trays are variable weight - every single one in the case has a
#     different sticker. There is no 32 oz (2 lb) chicken tray to pick up five
#     times. Real options are a ~2.5 lb family pack, a ~1.5 lb small tray, or a
#     fixed 3 lb frozen bag. Also: my catalog gives raw chicken keeps_days_raw
#     of 2, matching USDA guidance of 1-2 days; the list claims 3 days. Buying
#     10 lb of fresh chicken in one trip is not survivable at either number
#     without freezing, and nothing on the list freezes it or buys bags to do so.
#
# 11. "beef_chuck - 3 x 3.0 lb"
#     Chuck roasts run 2-4 lb and each is individually weighed. Three identical
#     3.0 lb roasts is not a purchase that can be made.
#
# 12. "pork_shoulder - 2 x 1800g"
#     Bone-in pork butt is sold as one whole 7-9 lb primal at around $1.79/lb;
#     the store does not cut it down. The nearest real thing is a boneless half
#     at ~1814 g, which is a different product at a different price per pound.
#     If the 1800 g was meant to be bone-in, ~15% of it is blade bone.
#
# 13. "shrimp_raw - 6 x 1 lb ... keeps 2d raw"
#     1 lb bags exist, but the list never states a count size (21/25? 31/40?),
#     which changes both the cooking and the dish. The bigger problem is the
#     2-day shelf life: counter "fresh" shrimp is thawed previously-frozen
#     product that must be cooked within a day and never refrozen. Six pounds of
#     it bought at once for a week of meals is not a shoppable plan. The frozen
#     bags are the same shrimp and keep for months, but the list does not ask
#     for them.
#
# --- Fluid ounces read as grams ---------------------------------------------
#
# 14. "neutral_oil - 1 x 950g"
#     Oil is sold in fluid ounces (16 / 24 / 48 / 96) and is lighter than water
#     at 0.92 g/mL. A 48 fl oz bottle holds 1306 g; a 24 fl oz holds 653 g.
#     950 g is ~35 fl oz - between two shelf sizes and equal to neither.
#
# 15. "olive_oil - 1 x 750g"
#     Olive oil bottles are 250 / 500 / 750 mL and 1 L. If "750" came from the
#     750 mL bottle, the mass is 686 g, not 750 g - a straight mL-to-gram
#     substitution that ignores oil's density. A true 750 g of olive oil is
#     820 mL, which is not a bottle anyone sells.
#
# 16. "chicken_stock - 4 x 33 oz"
#     Stock cartons are 32 fl oz (1 quart, 946 mL) or 48 fl oz. 33 oz is not a
#     size. It looks like 946 g being rounded back into ounces at water density
#     and landing one ounce off the real package it came from.
#
# 17. "coconut_aminos - 1 x 17 oz"
#     The real bottle is 16.9 fl oz - a 500 mL metric bottle in US clothing. At
#     ~1.05 g/mL that is ~525 g of product. "17 oz" is a fluid-ounce label being
#     treated as a weight, and the two differ by enough to matter for a recipe
#     using 60 g.
#
# 18. "rice_vinegar - 1 x 355g"
#     355 is the mL in a 12 fl oz bottle. It is reported as grams and happens to
#     be nearly correct because vinegar is water-density - which is precisely why
#     this class of error survives review until it hits an oil or a juice.
#
# --- Pack sizes no store carries --------------------------------------------
#
# 19. "lard - 2 x 15 oz"
#     Lard comes in 16 oz tubs/cans and 2.5 lb tubs. 15 oz is not a size.
#
# 20. "orange_juice - 1 x 1750g"
#     Cartons are 52 fl oz (~1610 g) and 89 fl oz jugs (~2750 g). Nothing on the
#     shelf is 1750 g. Note also the density: OJ is 1.045 g/mL, so even the
#     fluid-ounce-to-gram conversion is not 1:1.
#
# 21. "queso_fresco - 1 x 12 oz"
#     The major-chain round is 10 oz (283 g); 12 oz exists at some brands but is
#     not what is on this store's shelf. Needing 340 g means buying two 10 oz
#     rounds and having 226 g left to use within a week, not one clean package.
#
# 22. "roma_tomato - 6 x 500g" and "jalapeno - 3 x 150g" and "garlic - 3 x 150g"
#     All three are loose bin items priced per pound. There is no 500 g roma
#     package, no 150 g jalapeno package, and garlic is sold by the head (~50 g)
#     or in 3-head sleeves. The quantities are buyable; the units are invented.
#
# 23. "pineapple - 1 x 900g"
#     A whole pineapple is 1.6-2.0 kg and the store charges a flat price per
#     pineapple regardless. Roughly half is rind, core and crown. 900 g is very
#     close to the EDIBLE yield of one whole pineapple - which suggests the
#     planner is tracking usable flesh but writing it as if it were a purchase.
#     Either way there is no 900 g pineapple to put in a cart.
#
# 24. "rosemary - 1 x 20g"
#     Close: the real clamshell is 0.66 oz / 19 g. But it is the smallest unit in
#     existence, and the plan needs 10 g - so half of the only buyable package is
#     waste, which the "10g leftover" line does correctly notice.
#
# --- The big one: net vs drained ---------------------------------------------
#
# 25. "pinto_beans_canned - 14 x 15 oz (need 6146g, 0g leftover)"
#     Cans are 15.5 oz = 439 g NET, and net includes the brine. Drained weight,
#     which is what actually goes in the pot, is ~260 g per can. Fourteen cans
#     therefore deliver ~3640 g of beans against a stated need of 6146 g - a
#     shortfall of roughly 41%. If the requirement really is 6146 g of cooked
#     beans, the correct purchase is about 24 cans, or a $2.99 bag of dry pintos
#     that yields ~2.2 kg cooked. This is the single most consequential mismatch
#     in the list: it is not a labeling quibble, it means the meals do not have
#     enough food in them.
#
# --- Things the plan needs and never buys ------------------------------------
#
# 26. Salt appears nowhere on the list. Neither does black pepper. Every savory
#     recipe in a week of cooking uses both. They are stocked in this catalog
#     (kosher 3 lb, table 26 oz, ground pepper 4 oz) specifically so that their
#     absence is a finding about the plan and not an artifact of the store.
#
# 27. No aluminum foil, parchment, storage containers, or freezer bags. This is a
#     batch-cooking plan: it buys 10 lb of chicken, 9 lb of pork and 6 lb of
#     shrimp against 2-4 day raw shelf lives, cooks in bulk, and stores the
#     results - with nothing to store them in and nothing to freeze the surplus
#     raw protein in on shopping day. All of it is stocked here.
#
# 28. Water. Recipes need it; it is not a grocery. Bottled water is stocked as a
#     real product, but the correct behavior for a planner is to never list
#     cooking water at all.
#
# --- Storage claims worth checking -------------------------------------------
#
# 29. The list gives onions and garlic "keeps 30d raw" and groups them under
#     "Perishable (buy fresh)". Both are pantry items and both are actively
#     harmed by refrigeration - onions go soft, garlic sprouts. If the planner is
#     modeling refrigerator capacity, it is putting things in the fridge that do
#     not belong there and may be reporting a fridge as full when it is not.
#
# 30. "Total estimated cost: $415.80." Independent of the arithmetic, several
#     line items above are priced against packages that do not exist, so the
#     total is an estimate of a basket that cannot be assembled. The direction of
#     the error is not uniform: the bean shortfall would push the real total up,
#     while the whole-pineapple and pork-shoulder lines would push it down.
