  - id: ginger_root_loose
    display_name: "Ginger Root, loose"
    aliases: [ginger, fresh ginger, ginger root, gingerroot]
    aisle: produce
    sold_by: weight
    pack_g: 454
    pack_count: null
    price: 4.99
    perishable: true
    needs_refrigeration: true
    keeps_days_raw: 28
    freezable: true
    notes: "Per pound, and the one produce item where buying a small amount really works: you snap a knob off the hand at the bin. A typical knob is 70-120 g. Freezes well whole."

  - id: pineapple_whole_each
