schema_version: 1

# PROVENANCE
#
# Every pack size, selling unit, and price in this file was authored from
# real-world knowledge of how a US supermarket actually stocks and sells food.
# None of it was derived from, copied from, or reconciled against the meal
# planner's own ingredient data (examples/ingredients.yaml, services/solver/*).
# Those files were deliberately not opened while writing this catalog.
#
# The independence matters because this catalog is the instrument that tests
# whether the planner's shopping list can be shopped. If the store's pack sizes
# were taken from the planner's pack sizes, every list would be trivially
# shoppable and the test could never fail — it would be measuring the planner
# against itself. The disagreements between this file and the planner's list
# are the signal we are looking for, so this file must be free to disagree.
#
# Conventions used below:
#   - Loose produce and butcher-counter meat are `sold_by: weight` with
#     pack_g: 454 (one pound). Price is the per-pound shelf price. A shopper can
#     buy any weight; 1 lb is just the quoted increment.
#   - Fixed packages (bags, trays, cartons, cans) carry their true package
#     weight in pack_g, and price is for that one package.
#   - Liquids sold by fluid ounce are converted to grams at their real density
#     (oil ~0.92 g/mL, vinegar/stock ~1.00, juice ~1.045). This is why almost no
#     bottle in this store weighs a round number of grams.
#   - `pack_g` for `sold_by: count` is the realistic total package weight AS
#     SOLD, i.e. gross: eggs in the shell, avocados with pit and skin, whole
#     pineapple with crown and rind. Edible yield is called out in notes where
#     it differs sharply, because that gap is a common source of shortfall.
#
# Deliberately NOT stocked: there is no SKU named "spices" and none named
# "dried_chiles". No supermarket sells a product by those names — they are
# categories. Real jars and real cello bags of specific chiles are stocked
# instead. Same for "water": tap water is what recipes mean and it is free and
# unlimited at the sink, so it is not a purchasable ingredient. Bottled drinking
# water is stocked (it is a real product a real store sells), but a plan that
# puts cooking water on a shopping list is making a mistake this store will not
# absorb.

aisles: [produce, meat, seafood, dairy, dry_goods, canned, frozen, spices_baking, household]

skus:

