  - id: garlic_bag_3ct
    display_name: "Garlic, 3-head net bag"
    aliases: [garlic bag, garlic]
    aisle: produce
    sold_by: count
    pack_g: 150
    pack_count: 3
    price: 1.99
    perishable: true
    needs_refrigeration: false
    keeps_days_raw: 60
    freezable: false
