# components.yaml
# A COMPONENT is one thing you cook in a batch and later weigh onto a plate.
#
# The key design decision, and the thing that solves the nachos-vs-burrito problem:
#   Accents are their OWN components. Structural allergens live inside the component.
# So "breakfast burrito" = egg_potato_scramble + flour_tortilla + cheddar_shred(accent).
# Devon just gets 0g of cheddar. But "nachos" would be ONE component tagged [dairy],
# because you can't un-bake it — and the solver will never serve it to him.
# No variant machinery required. The data model is the answer.
#
# FIELDS
#   role:     main | starch | accent | veg
#   anchor:   lean            -> flags a low-fat protein. The library needs >=1 per week
#                               or the leaner eater becomes infeasible. See doctor.py.
#   yield_g:  finished cooked weight of ONE batch of this recipe
#   serve_g:  palatability bounds. The solver will happily prescribe 750g of tortilla
#             if you let it. These stop that.
#   unit_g:   set for DISCRETE things (tortillas, meatballs, wings). Grams snap to
#             multiples of this. Omit for continuous things (rice, braise, sauce).
#   batch_g:  granularity you can realistically cook/portion in.
#   source:   where the recipe came from. barefoodtim = Tim Laielli's substack.

