schema_version: 1
# ingredients.yaml
# Per-100g macros for RAW / as-purchased ingredients, plus how you actually buy them.
#
# Why this file exists: component macros are DERIVED from this, never typed by hand.
# Adding a recipe = listing its ingredients, which is what a recipe already is.
#
# perishable: true  -> counts toward the shared-ingredient / waste optimization
# perishable: false -> "free" (seasonings, oils, shelf-stable cans). Not a constraint.
# pack_g: how it comes off the shelf. You cannot buy 37g of cilantro.
# keeps_days: how long after purchase it's still good. Drives what can share a week.
# freezable: true -> if a cook session falls past raw keeps_days, the ingredient is
#   frozen on arrival instead of blocking that session; the cook plan carries a thaw
#   note. Raw meats/poultry/shrimp freeze fine; produce does not.

