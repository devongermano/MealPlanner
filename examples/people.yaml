schema_version: 1
# people.yaml
# targets are DAILY grams. kcal is derived, never entered (it would just drift).
#
# tolerance: fraction each macro may miss by. 0.05 = +/-5%.
#   When the solver says infeasible, fix the STRUCTURE first (PRD §8.3):
#   add the missing class of recipe, move a cook day, raise a serve bound
#   someone would actually eat — `mealplan doctor` names the gap and its
#   direction. Loosening tolerance is the explicit LAST resort: it redefines
#   success instead of fixing the plan.
# exclude: allergen/intolerance tags. A component carrying any of these tags
#   is hard-zeroed for that person. Tags come from ingredients.yaml (component
#   tags are the union of their ingredients' tags — never declared by hand).
# active_min_budget: total hands-on cooking minutes available per week.
#   Unattended oven/braise time does NOT count against this.

people:

  jimbo:
    targets: {protein: 235, fat: 157, carb: 588}
    tolerance: 0.05
    meals_per_day: 3      # LIVE (M1.9, PRD §4.0): the solved day is dealt into
                          # 3 composed meals (auto-named meal_1..meal_3; the
                          # serving model defaults to portioned)
    exclude: [soy, peanut, garbanzo]
    # VOLUME CAP. 588g of carbs from rice is ~4.9 lb of rice; from tortillas it is
    # ~2.5 lb. Setting this forces the menu toward dense carbs instead of asking him
    # to eat five pounds of food. null = no cap.
    max_daily_mass_g: null
    dislikes: []          # SOFT. weighted down, not forbidden. != exclude.

  devon:
    # PLACEHOLDER — replace with real numbers. Nothing downstream is right until you do.
    # Currently set to a generic maintenance-ish day for a lifter around 190-200lb.
    targets: {protein: 180, fat: 95, carb: 320}
    tolerance: 0.07
    serving_model: portioned   # M1.9: person-level default; slots inherit it
    meal_slots:                # M1.9 (PRD §4.0 Amendment 2): named slots with
                               # per-slot serving-model overrides — breakfast is
                               # family style ("have this much"), the rest are
                               # packed per-meal containers
      - {name: breakfast, serving_model: family_style}
      - {name: lunch}
      - {name: dinner}
    exclude: [dairy]
    max_daily_mass_g: null
    dislikes: []

settings:
  days: 7
  active_min_budget: 180        # two ~90 minute sessions
  # Each EXTRA batch of the same recipe costs this fraction of the first one.
  # Doubling a braise is nearly free; doubling meatballs is not. 0.45 is a
  # middle estimate — raise it if cook day keeps running long.
  batch_time_factor: 0.45
  max_days_same_component: 4    # variety guard: nothing more than 4 of 7 days
  min_lean_anchors: 2           # ENFORCED minimum of lean-anchor mains the menu search
                                # requires per person. `mealplan doctor`'s ablation
                                # DERIVES the number this library+household actually
                                # needs — set this to at least what it reports.
                                # (M0.5: the yaml used to say 1 but the prototype code
                                # hardcoded 2 — 2 IS the effective behavior, kept.)
  cook_days: [0, 4]             # REQUIRED (no default): cook sessions are data.
                                # you cook on day 1 and day 5 (0-indexed). shelf life
                                # is measured from the nearest prior cook day.
                                # [0,3] (Sun/Wed) leaves day 7 with no lean protein if
                                # your lean anchor only keeps 3 days. [0,4] (Sun/Thu) fixes it.
  shop_days: [0]                # shopping trips (0-indexed day). A session can only cook
                                # an ingredient still within raw keeps_days of the nearest
                                # prior trip — unless it's freezable, then it goes in the
                                # freezer on day 0 and the cook plan says when to thaw.
  max_batches_per_component: 3  # nobody wants 11 pounds of shrimp. caps how hard the
                                # solver may lean on one component in a week.
  dish_layer: strict            # M1.13: sides come ONLY from each dish's authored
                                # compatible_sides. This corpus's coverage is complete
                                # (every dish in dishes.yaml authors its sides, incl.
                                # deliberate "no sides" bowls), so the permissive
                                # migration mode would only reintroduce free mixing
                                # (fusilli beside a breakfast burrito) — the exact
                                # thing the dish layer exists to kill. The engine
                                # DEFAULT stays permissive until M1.6 (M113_SPEC §9).

# ---------------------------------------------------------------------------
# BUDGET POLICY. Nothing here is hardcoded into the solver — change it and re-run,
# or override per-run from the CLI:
#     mealplan all --budget 550
#     mealplan all --budget devon=320,jimbo=240
#     mealplan frontier                <- sweeps it and shows what each level buys
#
# mode:
#   shared          one household pot. `total` is the ceiling. Simplest.
#   per_person      each person has their own ceiling. Costs are attributed by
#                   consumption share, including their share of the leftovers.
#   by_consumption  no ceiling. Whatever the shop costs, it splits by calories eaten.
#   off             report cost, constrain nothing.
#
# Attribution note: a person's share = (cost of what they ate) / (cost of all food
# eaten) x (what the groceries actually cost). Leftovers get split too, because you
# both paid for them.
budget:
  mode: shared
  period: week
  total: 550
  per_person:
    devon: 300
    jimbo: 250
