  name: Bulgogi rice bowl
  source: "house recipe (soy-free bulgogi flank) — bowl format inferred, no source document"
  reconstruction: inferred
  components:
    jasmine_rice:        {base_g: 220, min_g: 100, max_g: 420}
    bulgogi_flank:       {base_g: 130, min_g: 60,  max_g: 280}
