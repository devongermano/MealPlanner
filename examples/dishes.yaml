  name: Scramble plate with rosemary potatoes
  source: "no source recipe — barefoodtim breakfast-burrito scramble + barefoodtim 008 potatoes"
  reconstruction: invented
  components:
    egg_potato_scramble: {base_g: 220, min_g: 100, max_g: 400}
    rosemary_potatoes:   {base_g: 150, min_g: 100, max_g: 350}
