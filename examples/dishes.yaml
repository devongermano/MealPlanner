    queso_fresco_crumbled: {base_g: 20,  min_g: 0,   max_g: 60}
  accents: [charred_salsa_roja, mexican_crema, queso_fresco_crumbled]
  compatible_sides: []
  meal_affinity: [lunch, dinner]
