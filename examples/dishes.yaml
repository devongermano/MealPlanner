  accents: []
  compatible_sides: [smashed_cucumber]
  meal_affinity: [lunch, dinner]
  notes: >
    INVENTED. Both halves are real recipes; nothing says they go on the same plate.
    Wings are weighed GROSS (bone in) — 270 g is six wings, of which about 178 g is
