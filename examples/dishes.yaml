- id: breakfast_burrito
  name: Breakfast burrito
  source: "barefoodtim - breakfast burritos"
  reconstruction: from_source
  components:
    flour_tortilla:      {base_g: 71,  min_g: 71,  max_g: 142}
    egg_potato_scramble: {base_g: 220, min_g: 100, max_g: 380}
    cheddar_shred:       {base_g: 30,  min_g: 0,   max_g: 80}
    charred_salsa_roja:  {base_g: 30,  min_g: 0,   max_g: 100}
  accents: [cheddar_shred, charred_salsa_roja]
  compatible_sides: [refried_pintos]
  meal_affinity: [breakfast, lunch]
  notes: >
    The canonical P4 example, and the reason accents are their own components: one
    batch of scramble, one stack of tortillas, and Devon's burrito gets 0 g of cheddar
    while Jimbo's gets 30 g. Same pots, different plates, no separate recipe.
    One 10-inch tortilla per burrito — the band allows a second for a double wrap.
    Beans can go inside rather than alongside; that is the same grams either way.

