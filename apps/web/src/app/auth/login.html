<app-auth-shell heading="Welcome back" subheading="Sign in to pick up this week's plan.">
  <form class="form-stack" [formGroup]="form" (ngSubmit)="signIn()" novalidate>
    @if (failure(); as message) {
      <app-alert tone="error">{{ message }}</app-alert>
    }

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        autocapitalize="off"
        spellcheck="false"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="hint error">Enter the email address you signed up with.</p>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <p class="hint error">Enter your password.</p>
      }
    </div>

    <button class="btn btn-primary btn-block" type="submit" [disabled]="pending()">
      {{ pending() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="form-footnote muted">
    New here? <a routerLink="/signup">Create an account</a>
  </p>
</app-auth-shell>
