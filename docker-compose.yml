# Local dev skeleton (M2 pre-work). Validates with `docker compose config`;
# running containers is M2 proper. Topology per ARCHITECTURE.md:
# web (dev server) -> api (NestJS, the one brain) -> solver (private FastAPI).
# Supabase local (`supabase start`) is separate and not composed here.

services:
  solver:
    # Placeholder until the FastAPI wrapper container lands (M2 proper).
    # Real service: services/solver — engine-in, result-out, no state.
    image: python:3.12-slim
    command:
      [
        "python",
        "-c",
        "print('solver placeholder — M2 proper runs the FastAPI wrapper from services/solver')",
      ]
    expose:
      - "8000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      SOLVER_URL: "http://solver:8000"
      # Postgres and Auth come from the Supabase stack, which is deliberately
      # NOT composed here — it is its own `supabase start`, run from apps/api
      # (see apps/api/supabase/config.toml). host.docker.internal is how a
      # container reaches it on the host; on Linux add
      #   extra_hosts: ["host.docker.internal:host-gateway"]
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}"
      SUPABASE_JWT_ISSUER: "${SUPABASE_JWT_ISSUER:-http://host.docker.internal:54321/auth/v1}"
      # Set exactly ONE of these — the API refuses to boot with both or neither.
      # The secret is the one value `supabase start` prints that you must copy.
      SUPABASE_JWT_SECRET: "${SUPABASE_JWT_SECRET:-}"
      SUPABASE_JWKS_URL: "${SUPABASE_JWKS_URL:-}"
    ports:
      - "3000:3000"
    depends_on:
      - solver

  web:
    # Dev-server-in-container; production web is a static build (Render).
    image: node:22.22.3-slim
    working_dir: /repo/apps/web
    volumes:
      - .:/repo
    command:
      [
        "sh",
        "-c",
        "corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm start -- --host 0.0.0.0",
      ]
    ports:
      - "4200:4200"
    depends_on:
      - api
