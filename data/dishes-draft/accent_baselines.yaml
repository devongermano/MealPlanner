schema_version: 0
# accent_baselines.yaml — STEWARD TOOLING DATA, not engine input.
#
# M1.13 §5 gives every accent the range {0} ∪ [serve_min, serve_max] of the
# component itself, so dishes.yaml carries accents as a bare id list with no
# per-dish band (§2 requires `accents` disjoint from `components`).
#
# But the reconstruction DID author a per-serving amount for each accent, and those
# amounts are what DISH_REVIEW.md shows the owner and what the per-serving macro
# figures include. Keeping them here — machine-readable, in one place — means the
# owner-facing numbers stay reproducible by `lint.py` instead of drifting away from
# a comment nobody recomputes.
#
# If the design panel decides accents SHOULD carry per-dish bands (the open question
# in dishes.yaml — 45 g of mozzarella on fusilli al forno is not 20 g on a taco),
# this file is the data for it, already reviewed. If it decides they should not,
# this file stays exactly what it is: documentation of authoring intent.
#
# base_g / max_g are PROVISIONAL, like every number in this directory.

accent_baselines:
  gorditas_de_picadillo:
    charred_salsa_roja: {base_g: 30, max_g: 100}
    queso_fresco_crumbled: {base_g: 25, max_g: 80}
