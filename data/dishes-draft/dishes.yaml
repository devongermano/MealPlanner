- id: salsa_verde_chicken_tacos
  name: Salsa verde chicken tacos
  cuisine: mexican
  source: "house recipe (salsa verde shredded chicken) — taco format inferred, no source document"
  reconstruction: inferred
  components:
    flour_tortilla:        {base_g: 142, min_g: 142, max_g: 213}
