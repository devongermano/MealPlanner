# =============================== ITALIAN / AMERICAN ===============================

- id: sausage_fusilli_al_forno
  name: Spicy sausage fusilli al forno
  cuisine: italian
  source: "barefoodtim 010 - spicy sausage fusilli al forno"
  reconstruction: from_source
  components:
    fusilli_cooked:   {base_g: 150, min_g: 112, max_g: 195}
    sausage_sugo:     {base_g: 225, min_g: 170, max_g: 290}
  # authored accent amounts, per serving — documentation, not engine input:
  #   mozzarella_shred 45 g (up to 90)
  accents: [mozzarella_shred]
  compatible_sides: []
  meal_affinity: [lunch, dinner]
  notes: >
    The baseline ratio is the SOURCE RECIPE'S OWN: its sugo batch is 1500 g and its
    pasta batch is 1000 g cooked, so 1.5 g of sauce per 1 g of pasta — 225 g sugo to
    150 g fusilli. This is a saucy, sausage-forward bake, not pasta with sauce on it.
    Mozzarella is the "al forno" — it goes on top and gets baked. It is an accent so
    that a dairy-free eater gets the same pasta without it.
    No side: the corpus has no salad or green vegetable that belongs next to this.

- id: turkey_meatballs_al_sugo
  name: Turkey meatballs in sugo, with fusilli
  cuisine: italian
  source: "no source recipe — house turkey meatballs + barefoodtim 010 sugo, paired here"
  reconstruction: invented
  components:
    turkey_meatballs: {base_g: 160, min_g: 120, max_g: 200}
    sausage_sugo:     {base_g: 180, min_g: 135, max_g: 234}
    fusilli_cooked:   {base_g: 150, min_g: 112, max_g: 195}
  # authored accent amounts, per serving — documentation, not engine input:
  #   mozzarella_shred 30 g (up to 90)
  accents: [mozzarella_shred]
  compatible_sides: []
  meal_affinity: [lunch, dinner]
  notes: >
    INVENTED. No recipe pairs these — the meatballs are a house recipe and the sugo
    belongs to the fusilli al forno. They are paired here because the sugo is the
    corpus's only red sauce and turkey meatballs are otherwise homeless.
    Two consequences to decide: (1) the sugo is built on hot Italian sausage, so this
    "lean" plate carries the sausage's fat — it is not the lean anchor its meatballs
    look like; (2) four 40 g meatballs is the baseline serving.
    If you'd rather have a plain tomato sauce for meatballs, that is a new component.

