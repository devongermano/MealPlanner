# dishes.yaml — THE ASSEMBLY LAYER (draft, Track F / M1.13)
#
# WHY THIS FILE EXISTS
# -------------------
# Owner correction, 2026-08-09: "These aren't meals — they're random ingredients
# served together… how is that following an actual recipe I gave you?"
#
# When the real recipes were ingested, they were split into COMPONENTS — the things
# you cook in a batch (picadillo, gordita shells, salsa). That split is correct for
# batch cooking: you cook one pot of picadillo, not one gordita at a time. But the
# split threw away the other half of every recipe: HOW THE PARTS GO BACK TOGETHER.
# A gordita is not "some masa and some beef in the same week." It is a shell, split
# and stuffed with picadillo, topped with salsa, queso and crema, in roughly these
# proportions.
#
# This file is that missing half. One entry per DISH: a named plate, with which
# components it is made of and how much of each goes in one serving.
#
# EVERY NUMBER IN THIS FILE IS PROVISIONAL AND AWAITS OWNER REVIEW.
# They are a cook's reconstruction, not measurements. Work through
# DISH_REVIEW.md and correct them; nothing downstream is right until you do.
#
#
# SCHEMA
# ------
#   id:          snake_case key. Stable — plans and history reference it.
#   name:        what you'd call it out loud.
#   source:      the ORIGINAL RECIPE this assembly comes from, or an honest
#                statement that there isn't one.
#   reconstruction:  how much of this assembly is real (see below). NOT optional —
#                    it is the honesty field that tells the reviewer how hard to look.
#   components:  {component_id: {base_g, min_g, max_g}} — per ONE SERVING, in grams
#                of the FINISHED component (cooked weight, as it comes out of the
#                batch container).
#                  base_g — the canonical serving. The dish's shape.
#                  min_g / max_g — how far this component may flex WITHIN ONE SERVING
#                    and still read as this dish. This is Devon's gordita: more
#                    picadillo, less shell, same dish.
#                    These bands are NOT the appetite range. A bigger eater gets more
#                    by eating more SERVINGS — M1.13 §5's continuous scalar `t` scales
#                    every member together, so the ratio survives at any size, up to
#                    T_MAX = min over members of serve_g.max / base_g. Widening a band
#                    to feed someone is therefore always a mistake: it adds no food,
#                    it only legalises a worse-looking plate.
#   cuisine:     the dish's cuisine. M1.13 §2 DERIVES this from the main-role member
#                when absent; stating it explicitly removes the ambiguity for a dish
#                with two mains and keeps the value stable if a component is ever
#                relabelled. Every value here matches what would be derived — nothing
#                is being overridden.
#   accents:     [component_id] — the optional per-person finishing layer (PRD P4).
#                One batch stays universal until the plate; the eater who can't have
#                dairy simply gets no queso and the dish is intact without it.
#                DISJOINT from `components`, per M1.13 §2. Accents carry no per-dish
#                band because the engine gives each one {0} ∪ [serve_min, serve_max]
#                of the component itself (M1.13 §5). The per-serving amounts this
#                reconstruction authored are kept as comments above each list, and in
#                DISH_REVIEW.md, so the owner still reviews a real number.
#                OPEN QUESTION for the design panel: those amounts genuinely differ by
#                dish — 45 g of mozzarella baked onto fusilli al forno is not the 20 g
#                crumbled over a taco — so per-dish accent bands may be worth having.
#                Raised, not assumed.
#   compatible_sides: [component_id] — things that may be served ALONGSIDE this dish
#                but are not part of it (beans next to gorditas). No bands here: the
#                side's own serve_g in components.yaml governs it.
#   meal_affinity: [breakfast|lunch|dinner|any] — which meal slots this dish belongs
#                in. Meal-time affinity lives on DISHES, not components (PRD §4.0).
#   notes:       anything the reviewer needs to know, including what's missing.
#
#
# THE `reconstruction` FIELD — read this before trusting a number
# --------------------------------------------------------------
#   from_source  A named recipe defines this assembly. The parts, and roughly the
#                proportions, come from that recipe. Highest confidence.
#   inferred     The components come from a `source: house` recipe — there is no
#                recipe document to read, so the FORMAT was inferred from what the
#                component obviously is (carnitas → tacos; a braise → tacos or a
#                bowl). Confident about the format, guessing at the grams.
#   invented     Nothing in the corpus implies this plate. It was built to give a
#                component a home or to fill an obvious hole. Treat as a proposal.
#                Rejecting these costs nothing.
#
#
# RULES THE LINT ENFORCES (data/dishes-draft/lint.py)
# --------------------------------------------------
#   - every component_id exists in examples/components.yaml
#   - every dish has >= 1 core component (no dish is only garnish)
#   - 0 < min_g <= base_g <= max_g, whole grams (M1.13 §2: a core member has min_g > 0)
#   - `accents` disjoint from `components` (M1.13 §2), and every accent id has
#     role `accent` in the corpus
#   - max_g <= that component's serve_g.max, and min_g >= serve_g.min.
#     serve_g bounds are per-dish palatability ABSOLUTES (PRD Appendix B item 2 —
#     the lard-beans incident). A dish may not authorize a portion the component
#     itself calls inedible. M1.13 §2 makes min_g > serve_g.max an ERROR — one
#     serving could not exist inside the authored absolutes.
#   - components with unit_g (tortillas, wings, meatballs, shells): base/min/max sit
#     on the unit grid. You cannot serve 1.4 tortillas.
#   - every `main` component appears in >= 1 dish; every accent attaches somewhere
#   - meal_affinity values valid; `any` never mixed with specific slots
#   - DISH_BAND_LOOSE (M1.13 §2): warns when the bands permit a degenerate ratio —
#     worst-case pairwise (max_i/min_j)/(base_i/base_j) over 3.0. See below.
#
#
# BAND WIDTH — RE-AUTHORED 2026-08-10
# -----------------------------------
# The first draft of these bands was written before M1.13 existed, and every one of
# them made each band do two jobs at once: express how far the ratio may flex, AND
# cover the whole appetite range from the smallest eater to the largest. That is why
# gorditas once allowed 85-340 g of shell against 80-340 g of picadillo — a band that
# legalised four shells with the minimum filling (a dry gordita) and one shell under
# 340 g of meat (a bowl of meat with a shell in it). All 16 dishes tripped the spec's
# DISH_BAND_LOOSE lint at ratio errors of 4.0-6.0 against a 3.0 threshold. Exactly the
# incoherence the dish layer exists to prevent, quantified.
#
# M1.13 §5 removes the second job: `t` is a continuous SERVINGS scalar, so appetite is
# served by eating 1.5 or 2 servings with every member scaling together and the ratio
# preserved, capped by T_MAX = min over members of serve_g.max / base_g. Bands now
# cover ratio flex within ONE serving only.
#
# Re-authored on that meaning, roughly +/-30% around base for continuous members, with
# culinary judgement where a percentage is the wrong tool:
#   - Discrete carriers flex by whole pieces, not percentages. Tacos are 2-3 tortillas
#     (142-213 g), gorditas 2-3 shells (170-255 g), wings 5-7 (225-315 g), meatballs
#     3-5 (120-200 g).
#   - The breakfast burrito's tortilla is PINNED at 71 g. One 10-inch tortilla is what
#     a burrito is; two is two burritos, which is t = 2, not a wider band.
#   - refried_pintos bottoms out at 80 g rather than 70 g in every bowl, because 80 g
#     is the component's own authored serve_g minimum — a dish may not ask for a
#     portion smaller than the smallest sensible one.
#
# Result: worst-case ratio errors now run 1.33-2.18, all inside the 3.0 threshold, and
# no dish lost reach — T_MAX runs 1.78-3.00, so a ~1570 kcal meal is reachable on core
# members alone for ten of the sixteen dishes and on core-plus-sides for the rest
# (M1.13 §7's ladder, in order: scale within bands, then hearty sides, then the opt-in
# second dish).
#
#
# KNOWN GAPS, FOR THE OWNER (details in DISH_REVIEW.md)
# ----------------------------------------------------
#   - No corn tortilla component. Carnitas, birria and al pastor tacos all want one;
#     the corpus has flour only (corn_tortilla exists as an INGREDIENT, unused).
#   - No raw-onion/cilantro garnish component — the standard taco finish.
#   - No RESERVED consommé for birria. The braise keeps its liquid inside the component
#     (the method portions the beef moistened with broth), so there is nothing to
#     griddle a tortilla in or drink alongside. Quesabirria needs that plus a melter.
#   - Exactly one vegetable in the whole corpus (smashed_cucumber, Korean). The
#     Italian and Mexican dishes have no salad or green side to offer.
#   - No melting cheese labelled for Mexican food (quesabirria). The corpus's only
#     melters are mozzarella_shred (italian) and cheddar_shred (crossover).
#
#
# INTEGRATION NOTES, FOR WHOEVER BUILDS M1.13 (not owner-facing)
# -------------------------------------------------------------
# This file is data. Nothing consumes it yet. Four things this corpus makes visible
# that the design panel should settle BEFORE the dealer becomes a dish-dealer:
#
# 1. serve_g is per-DAY in the engine, per-SERVING here. M19_SPEC §3.3 records the
#    mismatch already ("serve_g is authored per SERVING but the day pool applies it to
#    day totals"). Dish bands are unambiguously per serving. Eat carnitas_tacos twice in
#    one day and flour_tortilla lands at 284 g — exactly its component max. The next
#    dish eaten twice will collide. Decide which layer owns the absolute.
#
# 2. Exactly one dish has two `main`-role components: turkey_meatballs_al_sugo
#    (meatballs + sugo). The M1.9 dealer treats mains as ATOMIC and enforces a distinct
#    main per slot. Under dish-dealing, the variety rule should key on DISH id, not on
#    main component id — PRD Amendment 2's "no repeated main across slots" becomes "no
#    repeated dish", which is what a human means by variety anyway.
#
# 3. `anchor: lean` is a component property and does not survive assembly.
#    turkey_meatballs is a lean anchor; turkey_meatballs_al_sugo is 57 g of fat a
#    serving, because the sugo is built on hot Italian sausage. If `min_lean_anchors`
#    starts operating on dishes, derive leanness from the dish's own baseline macros —
#    do not inherit the flag from the main.
#
# 4. Batching is genuinely unaffected, and the corpus proves the consolidation is
#    load-bearing: charred_salsa_roja is a component of 9 of the 16 dishes,
#    flour_tortilla of 5, cilantro_lime_rice of 4. Components stay the batch unit;
#    dishes only decide what lands together on the plate.

dishes:

# ================================ MEXICAN / TEX-MEX ================================

- id: gorditas_de_picadillo
  name: Gorditas de picadillo
  cuisine: mexican
  source: "barefoodtim - gorditas de picadillo (Vitamina T)"
  reconstruction: from_source
  components:
    gordita_shell:         {base_g: 170, min_g: 170, max_g: 255}
    picadillo:             {base_g: 160, min_g: 110, max_g: 210}
  # authored accent amounts, per serving — documentation, not engine input:
  #   charred_salsa_roja 30 g (up to 100)
  #   queso_fresco_crumbled 25 g (up to 80)
  #   mexican_crema 20 g (up to 60)
  accents: [charred_salsa_roja, queso_fresco_crumbled, mexican_crema]
  compatible_sides: [refried_pintos, cilantro_lime_rice]
  meal_affinity: [lunch, dinner]
  notes: >
    Two shells is one serving (a batch of shells is five). Each shell is split along
    the edge while warm and stuffed with picadillo, then finished with salsa, crumbled
    queso and crema. Baseline filling is ~80 g per shell. The shells are lard-rich by
    the recipe (70 g lard in a 425 g batch), which is why this plate reads fatty on
    paper — that is the dish, not an error.

- id: carnitas_tacos
  name: Carnitas tacos
  cuisine: mexican
  source: "house recipe (orange-lard carnitas) — taco format inferred, no source document"
  reconstruction: inferred
  components:
    flour_tortilla:        {base_g: 142, min_g: 142, max_g: 213}
    carnitas:              {base_g: 140, min_g: 105, max_g: 180}
  # authored accent amounts, per serving — documentation, not engine input:
  #   charred_salsa_roja 30 g (up to 100)
  #   guacamole 40 g (up to 120)
  #   queso_fresco_crumbled 20 g (up to 60)
  accents: [charred_salsa_roja, guacamole, queso_fresco_crumbled]
  compatible_sides: [refried_pintos, cilantro_lime_rice]
  meal_affinity: [lunch, dinner]
  notes: >
    Two tacos, ~70 g meat each. Wants corn tortillas and a raw onion-cilantro finish;
    the corpus has neither, so this is flour-tortilla carnitas until the owner says
    otherwise.

- id: carnitas_bowl
  name: Carnitas rice bowl
  cuisine: mexican
  source: "house recipe (orange-lard carnitas) — bowl format inferred, no source document"
  reconstruction: inferred
  components:
    cilantro_lime_rice:  {base_g: 200, min_g: 140, max_g: 260}
    carnitas:            {base_g: 140, min_g: 105, max_g: 180}
    refried_pintos:      {base_g: 100, min_g: 80, max_g: 130}
  # authored accent amounts, per serving — documentation, not engine input:
  #   charred_salsa_roja 30 g (up to 100)
  #   guacamole 40 g (up to 120)
  #   mexican_crema 20 g (up to 60)
  accents: [charred_salsa_roja, guacamole, mexican_crema]
  compatible_sides: []
  meal_affinity: [lunch, dinner]
  notes: >
    The no-tortilla version of the same meat: rice and beans in the bowl, everything
    else on top. Exists mostly so carnitas has a wheat-free home and a carb-dense one
    (rice moves further than tortillas when someone needs 588 g of carbs).

- id: birria_tacos
  name: Birria tacos
  cuisine: mexican
  source: "house recipe (chile-braised chuck) — taco format inferred, no source document"
  reconstruction: inferred
  components:
    flour_tortilla:        {base_g: 142, min_g: 142, max_g: 213}
    birria_chuck:          {base_g: 150, min_g: 112, max_g: 195}
  # authored accent amounts, per serving — documentation, not engine input:
  #   charred_salsa_roja 30 g (up to 100)
  #   queso_fresco_crumbled 25 g (up to 80)
  accents: [charred_salsa_roja, queso_fresco_crumbled]
  compatible_sides: [cilantro_lime_rice, refried_pintos]
  meal_affinity: [lunch, dinner]
  notes: >
    Reconstructed as plain birria tacos, NOT quesabirria. Two reasons, both from the
    recipe itself: the corpus has no melting cheese labelled for Mexican food, and the
    method folds the skimmed consommé back into the meat and portions the beef
    moistened with broth — so the braising liquid is already inside this component's
    1500 g yield. There is no separate consommé to griddle the tortillas in or drink
    alongside; that ritual needs its own component (reserved broth) plus a melting
    cheese before quesabirria is a dish this library can make.

- id: birria_bowl
