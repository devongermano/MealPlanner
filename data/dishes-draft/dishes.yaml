  #   guacamole 40 g (up to 120)
  #   charred_salsa_roja 30 g (up to 100)
  accents: [guacamole, charred_salsa_roja]
  compatible_sides: [cilantro_lime_rice, refried_pintos]
  meal_affinity: [lunch, dinner]
  notes: >
    Al pastor is a taco by construction — the pineapple in the shrimp is the al pastor
    signature and it goes in the tortilla. The leanest plate in the corpus at baseline;
