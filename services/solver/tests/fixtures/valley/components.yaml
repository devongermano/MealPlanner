schema_version: 1
components:
- id: stew
  name: stew
  cuisine: test
  role: main
  anchor: lean
  yield_g: 2000
  # max sized so val's 1,765-kcal 0.706-scaled band (M1.7) still admits the
  # ~560g of stew their 120g protein target requires on days 0-5
  serve_g: {min: 100, max: 900}
  keeps_days: 3
  freezes: false
  active_min: 30
  ingredients: {stew_mix: 2000}
- id: rice_pot
  name: rice_pot
  cuisine: test
  role: starch
  yield_g: 2000
  # max sized so the 0.706-scaled band (M1.7) still carries the ~207g carb
  # floor from rice alone (~690g at 30 c/100g)
  serve_g: {min: 100, max: 1200}
  keeps_days: 7
  active_min: 15
  ingredients: {rice_mix: 2000}
- id: garden_veg
  name: garden_veg
  cuisine: test2
  role: veg
  yield_g: 400
  serve_g: {min: 50, max: 300}
  keeps_days: 7
  active_min: 10
  ingredients: {veg_mix: 400}
- id: oil_drizzle
  name: oil_drizzle
  cuisine: test
  role: accent
  yield_g: 200
  serve_g: {min: 5, max: 60}
  keeps_days: 21
  active_min: 2
  ingredients: {oil_mix: 200}
