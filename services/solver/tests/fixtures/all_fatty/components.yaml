schema_version: 1
components:
- id: sausage_skillet
  name: sausage_skillet
  cuisine: test
  role: main
  yield_g: 500
  # main maxes sized so fatima's 1,925-kcal 0.77-scaled bands (M1.7) still
  # let the two fatty mains REACH her protein band — the fat-forcing trade
  # needs protein reachable, with fat dragged over
  serve_g: {min: 100, max: 800}
  keeps_days: 5
  active_min: 25
  ingredients: {sausage_mix: 500}
- id: belly_braise
  name: belly_braise
  cuisine: test2
  role: main
  yield_g: 500
  serve_g: {min: 100, max: 800}
  keeps_days: 6
  active_min: 35
  ingredients: {belly_mix: 500}
- id: rice_pot
  name: rice_pot
  cuisine: test
  role: starch
  yield_g: 900
  # max sized so the 0.77-scaled band (M1.7) still carries fatima's 190g
  # carb floor from rice alone (~635g at 30 c/100g)
  serve_g: {min: 100, max: 1000}
  keeps_days: 7
  active_min: 15
  ingredients: {rice_mix: 900}
- id: oil_drizzle
  name: oil_drizzle
  cuisine: test
  role: accent
  yield_g: 200
  serve_g: {min: 5, max: 60}
  keeps_days: 21
  active_min: 2
  ingredients: {oil_mix: 200}
